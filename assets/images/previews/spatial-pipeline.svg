<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FFFFFF"/>

  <!-- Title bar -->
  <g>
    <rect x="60" y="40" width="680" height="60" rx="8" fill="#2a6d52" opacity="0.92"/>
    <text x="80" y="68" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="white">Spatial Pipeline</text>
    <text x="80" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="white" opacity="0.85">Engine eronder — geometrie en attributen gescheiden</text>
  </g>

  <!-- Three input cards: CityJSON tile · IMRO plans · context-layer -->
  <g transform="translate(60, 130)">
    <!-- Card 1: 3D BAG tile -->
    <rect x="0" y="0" width="180" height="120" rx="8" fill="white" stroke="#d8d6cf" stroke-width="1.5"/>
    <text x="14" y="22" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b6f6c" letter-spacing="0.06em">① 3D-MODEL</text>
    <text x="14" y="38" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2421">CityJSON 2.0</text>
    <!-- Tessellated buildings inside card -->
    <g transform="translate(20, 50)">
      <polygon points="10,40 30,30 30,55 10,60" fill="#c89048" opacity="0.9"/>
      <polygon points="30,30 50,32 50,55 30,55" fill="#b87a36" opacity="0.9"/>
      <polygon points="30,30 40,18 60,20 50,32" fill="#d4a05c" opacity="0.95"/>
      <polygon points="60,55 80,50 80,65 60,68" fill="#a87a52" opacity="0.85"/>
      <polygon points="80,50 100,52 100,65 80,65" fill="#986a42" opacity="0.85"/>
      <polygon points="80,50 90,40 110,42 100,52" fill="#b88a62" opacity="0.9"/>
      <polygon points="110,55 130,50 130,65 110,68" fill="#7aaf60" opacity="0.85"/>
      <polygon points="130,50 150,55 150,68 130,65" fill="#6a9f50" opacity="0.85"/>
    </g>
  </g>

  <g transform="translate(310, 130)">
    <!-- Card 2: IMRO plans -->
    <rect x="0" y="0" width="180" height="120" rx="8" fill="white" stroke="#d8d6cf" stroke-width="1.5"/>
    <text x="14" y="22" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b6f6c" letter-spacing="0.06em">② BESTEMMINGSPLANNEN</text>
    <text x="14" y="38" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2421">IMRO2008 + IMRO2012</text>
    <!-- Plan polygons stacked -->
    <g transform="translate(20, 48)">
      <polygon points="0,30 80,20 90,55 10,65" fill="#e9b864" opacity="0.6"/>
      <polygon points="80,20 140,28 130,60 90,55" fill="#8bbf6f" opacity="0.6"/>
      <polygon points="10,55 90,52 95,68 5,72" fill="#9a9a9a" opacity="0.55"/>
      <polygon points="90,52 130,55 125,68 95,68" fill="#6fa5d8" opacity="0.55"/>
    </g>
    <!-- Plan labels -->
    <rect x="14" y="100" width="6" height="6" fill="#e9b864" opacity="0.85"/>
    <text x="24" y="106" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b6f6c">wonen</text>
    <rect x="60" y="100" width="6" height="6" fill="#8bbf6f" opacity="0.85"/>
    <text x="70" y="106" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b6f6c">groen</text>
    <rect x="105" y="100" width="6" height="6" fill="#9a9a9a" opacity="0.85"/>
    <text x="115" y="106" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b6f6c">verkeer</text>
  </g>

  <g transform="translate(560, 130)">
    <!-- Card 3: optional context-layer -->
    <rect x="0" y="0" width="180" height="120" rx="8" fill="white" stroke="#d8d6cf" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="14" y="22" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b6f6c" letter-spacing="0.06em">③ CONTEXT-LAAG</text>
    <text x="14" y="38" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6f6c" font-style="italic">optioneel — CSV/GeoJSON</text>
    <!-- Context features: dots + lines suggesting various layers -->
    <g transform="translate(20, 50)">
      <circle cx="20" cy="30" r="4" fill="#2a6d52" opacity="0.9"/>
      <circle cx="60" cy="20" r="4" fill="#2a6d52" opacity="0.9"/>
      <circle cx="105" cy="40" r="4" fill="#2a6d52" opacity="0.9"/>
      <circle cx="135" cy="25" r="4" fill="#2a6d52" opacity="0.9"/>
      <line x1="20" y1="30" x2="60" y2="20" stroke="#2a6d52" stroke-width="1.5" opacity="0.6"/>
      <line x1="60" y1="20" x2="105" y2="40" stroke="#2a6d52" stroke-width="1.5" opacity="0.6"/>
      <line x1="105" y1="40" x2="135" y2="25" stroke="#2a6d52" stroke-width="1.5" opacity="0.6"/>
      <text x="0" y="65" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b6f6c">bv. utility-locaties, points-of-interest, lijnen…</text>
    </g>
  </g>

  <!-- Pipeline arrow merge -->
  <g>
    <path d="M 150 270 Q 400 285 400 300" fill="none" stroke="#2a6d52" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
    <path d="M 400 270 L 400 300" fill="none" stroke="#2a6d52" stroke-width="2" opacity="0.7"/>
    <path d="M 650 270 Q 400 285 400 300" fill="none" stroke="#2a6d52" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
    <polygon points="394,300 400,310 406,300" fill="#2a6d52" opacity="0.85"/>
  </g>

  <!-- Pipeline core box: in-browser join -->
  <g>
    <rect x="220" y="320" width="360" height="74" rx="8" fill="#d6ecdf" stroke="#2a6d52" stroke-width="1.5"/>
    <text x="240" y="342" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2a6d52" letter-spacing="0.06em">IN-BROWSER PIPELINE</text>
    <text x="240" y="360" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2421">multi-source geometric join</text>
    <text x="240" y="375" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6f6c">primair = eerste-match-wint · overlays = alle matches</text>
    <text x="240" y="389" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6f6c">provenance per regel · 0 outbound requests</text>
  </g>

  <!-- Output arrow + outputs -->
  <g>
    <path d="M 400 394 L 400 415" fill="none" stroke="#2a6d52" stroke-width="2" opacity="0.7"/>
    <polygon points="394,415 400,425 406,415" fill="#2a6d52" opacity="0.85"/>
  </g>

  <g transform="translate(220, 432)">
    <rect x="0" y="0" width="170" height="48" rx="6" fill="white" stroke="#2a6d52" stroke-width="1.5"/>
    <text x="14" y="20" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1f2421">model.glb</text>
    <text x="14" y="36" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6f6c">geometrie + IDs (groot, naar bril)</text>
  </g>

  <g transform="translate(410, 432)">
    <rect x="0" y="0" width="170" height="48" rx="6" fill="white" stroke="#2a6d52" stroke-width="1.5"/>
    <text x="14" y="20" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1f2421">attributes.jsonld</text>
    <text x="14" y="36" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6f6c">linked-data (klein, on-demand)</text>
  </g>

  <!-- Decorative subtle triangles in corners (consistent with sibling demos) -->
  <polygon points="50,420 70,408 64,440" fill="#2a6d52" opacity="0.1"/>
  <polygon points="710,425 730,415 724,445" fill="#2a6d52" opacity="0.1"/>
  <polygon points="40,260 56,250 50,278" fill="#2a6d52" opacity="0.1"/>
  <polygon points="725,260 745,250 738,278" fill="#2a6d52" opacity="0.1"/>
</svg>
