<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FFFFFF"/>

  <!-- ============================================================
       VR HEADSET — tessellated, centered, brand emerald palette
       Roughly x:240-560, y:170-330 (front shell + strap edges)
       ============================================================ -->

  <!-- Headset strap (back, faint) -->
  <polygon points="195,250 240,210 240,290" fill="#368868" opacity="0.55"/>
  <polygon points="605,250 560,210 560,290" fill="#368868" opacity="0.55"/>

  <!-- Headset front shell — main body, tessellated -->
  <!-- Top half (lighter) -->
  <polygon points="240,210 400,170 560,210 560,250 400,235 240,250" fill="#368868"/>
  <polygon points="240,210 400,170 320,210" fill="#46b186" opacity="0.92"/>
  <polygon points="400,170 560,210 480,210" fill="#46b186" opacity="0.92"/>
  <polygon points="320,210 400,170 480,210 400,235" fill="#3d9c75"/>
  <polygon points="240,210 320,210 280,250 240,250" fill="#368868" opacity="0.95"/>
  <polygon points="320,210 400,235 280,250" fill="#2f7a5d"/>
  <polygon points="480,210 560,210 560,250 520,250" fill="#368868" opacity="0.95"/>
  <polygon points="480,210 400,235 520,250" fill="#2f7a5d"/>

  <!-- Bottom half (deeper) -->
  <polygon points="240,250 400,235 560,250 540,310 260,310" fill="#2a6d52"/>
  <polygon points="240,250 280,250 260,310" fill="#1f5440" opacity="0.95"/>
  <polygon points="560,250 520,250 540,310" fill="#1f5440" opacity="0.95"/>
  <polygon points="280,250 400,235 320,290" fill="#2a6d52"/>
  <polygon points="400,235 520,250 480,290" fill="#2a6d52"/>
  <polygon points="280,250 320,290 260,310" fill="#225a44"/>
  <polygon points="520,250 480,290 540,310" fill="#225a44"/>
  <polygon points="320,290 400,235 480,290" fill="#1f5440" opacity="0.85"/>
  <polygon points="320,290 480,290 540,310 260,310" fill="#143828" opacity="0.55"/>

  <!-- ============================================================
       TWO LENSES — windows into the spatial data
       Tessellated low-poly city/landscape visible inside each
       ============================================================ -->

  <!-- Left lens outer ring + inner -->
  <ellipse cx="335" cy="245" rx="62" ry="44" fill="#143828"/>
  <ellipse cx="335" cy="245" rx="56" ry="38" fill="#FFFFFF"/>
  <!-- Building silhouettes inside the left lens (clipped by lens area visually) -->
  <g>
    <clipPath id="lensL"><ellipse cx="335" cy="245" rx="56" ry="38"/></clipPath>
    <g clip-path="url(#lensL)">
      <!-- Sky-tint (warm IMRO yellow translucent) -->
      <rect x="279" y="207" width="112" height="40" fill="#E9B864" opacity="0.18"/>
      <!-- Ground -->
      <rect x="279" y="262" width="112" height="22" fill="#F5F0E3"/>
      <!-- Tessellated buildings inside -->
      <polygon points="290,262 290,240 308,232 308,262" fill="#2a6d52"/>
      <polygon points="308,262 308,232 320,228 320,262" fill="#368868"/>
      <polygon points="320,262 320,228 336,238 336,262" fill="#46b186"/>
      <polygon points="336,262 336,238 352,224 352,262" fill="#2a6d52"/>
      <polygon points="352,262 352,224 368,232 368,262" fill="#368868"/>
      <polygon points="368,262 368,232 384,240 384,262" fill="#46b186"/>
      <!-- Roof apexes -->
      <polygon points="290,240 308,232 295,237" fill="#46b186" opacity="0.7"/>
      <polygon points="336,238 352,224 344,232" fill="#46b186" opacity="0.7"/>
    </g>
  </g>

  <!-- Right lens — mirrored, but shows linked-data nodes (JSON-LD glimpse) -->
  <ellipse cx="465" cy="245" rx="62" ry="44" fill="#143828"/>
  <ellipse cx="465" cy="245" rx="56" ry="38" fill="#FFFFFF"/>
  <g>
    <clipPath id="lensR"><ellipse cx="465" cy="245" rx="56" ry="38"/></clipPath>
    <g clip-path="url(#lensR)">
      <!-- Soft brand-mist background -->
      <rect x="409" y="207" width="112" height="76" fill="#F0F7F3"/>
      <!-- Linked-data graph -->
      <g stroke="#2a6d52" stroke-width="1.5" fill="none" opacity="0.85">
        <line x1="425" y1="230" x2="450" y2="218"/>
        <line x1="425" y1="230" x2="450" y2="245"/>
        <line x1="450" y1="218" x2="478" y2="225"/>
        <line x1="450" y1="245" x2="478" y2="225"/>
        <line x1="450" y1="245" x2="478" y2="260"/>
        <line x1="478" y1="225" x2="500" y2="240"/>
        <line x1="478" y1="260" x2="500" y2="240"/>
        <line x1="450" y1="245" x2="440" y2="268"/>
      </g>
      <circle cx="425" cy="230" r="4" fill="#2a6d52"/>
      <circle cx="450" cy="218" r="5" fill="#368868"/>
      <circle cx="478" cy="225" r="4" fill="#2a6d52"/>
      <circle cx="500" cy="240" r="5" fill="#46b186"/>
      <circle cx="478" cy="260" r="4" fill="#2a6d52"/>
      <circle cx="450" cy="245" r="6" fill="#46b186"/>
      <circle cx="440" cy="268" r="3" fill="#368868"/>
    </g>
  </g>

  <!-- Nose bridge between lenses -->
  <polygon points="397,250 403,250 400,272" fill="#1f5440"/>

  <!-- ============================================================
       DATA FLOW — small triangulated stream feeding the headset
       From left side: tessellated buildings stream (geometry input)
       ============================================================ -->
  <g opacity="0.95">
    <!-- Building polygons drifting into the headset from left -->
    <polygon points="100,260 130,240 130,290" fill="#2a6d52"/>
    <polygon points="130,240 160,250 160,290 130,290" fill="#1f5440"/>
    <polygon points="100,260 130,240 160,250 130,255" fill="#368868"/>

    <polygon points="150,232 175,218 175,258" fill="#368868"/>
    <polygon points="175,218 200,228 200,258 175,258" fill="#2a6d52"/>
    <polygon points="150,232 175,218 200,228 175,232" fill="#46b186"/>

    <polygon points="195,265 215,253 215,288" fill="#2a6d52" opacity="0.85"/>
    <polygon points="215,253 230,258 230,288 215,288" fill="#1f5440" opacity="0.85"/>
  </g>
  <!-- flow arrow into headset -->
  <polygon points="222,250 240,245 240,255" fill="#2a6d52" opacity="0.8"/>

  <!-- ============================================================
       DATA FLOW — right side: linked-data nodes flowing out
       (engine eronder → app opkijkt → data naar boven)
       ============================================================ -->
  <g stroke="#2a6d52" stroke-width="1.6" fill="none" opacity="0.7">
    <line x1="565" y1="248" x2="595" y2="232"/>
    <line x1="595" y1="232" x2="630" y2="248"/>
    <line x1="565" y1="248" x2="600" y2="265"/>
    <line x1="600" y1="265" x2="635" y2="278"/>
    <line x1="630" y1="248" x2="660" y2="232"/>
    <line x1="630" y1="248" x2="665" y2="265"/>
    <line x1="635" y1="278" x2="665" y2="265"/>
  </g>
  <circle cx="595" cy="232" r="5" fill="#368868"/>
  <circle cx="630" cy="248" r="6" fill="#2a6d52"/>
  <circle cx="600" cy="265" r="4" fill="#46b186"/>
  <circle cx="635" cy="278" r="5" fill="#368868"/>
  <circle cx="660" cy="232" r="5" fill="#2a6d52"/>
  <circle cx="665" cy="265" r="6" fill="#46b186"/>
  <polygon points="558,250 575,245 575,255" fill="#2a6d52" opacity="0.6"/>

  <!-- ============================================================
       BRAND TRIANGULATION ACCENTS (sparse, corners only)
       ============================================================ -->
  <polygon points="44,80 70,62 62,98" fill="#2a6d52" opacity="0.14"/>
  <polygon points="736,80 762,62 754,98" fill="#FFA92D" opacity="0.16"/>
  <polygon points="44,440 70,422 62,458" fill="#46b186" opacity="0.14"/>
  <polygon points="736,440 762,422 754,458" fill="#2a6d52" opacity="0.12"/>
</svg>
